name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  project-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project structure and dashboard data
        run: python scripts/validate_project.py

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static dashboard artifact
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp project/PROJECT_STATUS.json _site/data/status.json
          test -s _site/index.html
          test -s _site/data/status.json
      - name: Upload dashboard preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: optilink-dashboard-${{ github.sha }}
          path: _site

  tf-002-web-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/tf-002-single-code
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned spike dependencies
        run: npm install --no-audit --no-fund
      - name: Protocol tests
        run: npm test
      - name: Validate lab coordinator syntax
        run: node --check lab-server.mjs
      - name: Smoke-test lab HTTP routes
        run: |
          node lab-server.mjs > /tmp/optilink-lab.log 2>&1 &
          LAB_PID=$!
          trap 'kill $LAB_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/api/lab/health > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status": "OK"' /tmp/health.json
          curl --fail --silent 'http://127.0.0.1:5173/?role=sender' | grep -q 'Single-code optical baseline'
          curl --fail --silent 'http://127.0.0.1:5173/?role=receiver' | grep -q 'Receiver / Camera'
      - name: Typecheck and build browser spike
        run: npm run build
      - name: Upload TF-002 static build
        uses: actions/upload-artifact@v4
        with:
          name: optilink-tf-002-${{ github.sha }}
          path: experiments/tf-002-single-code/dist
