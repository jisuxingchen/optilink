name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  project-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project structure and dashboard data
        run: python scripts/validate_project.py

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static dashboard artifact
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp project/PROJECT_STATUS.json _site/data/status.json
          test -s _site/index.html
          test -s _site/data/status.json
      - name: Upload dashboard preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: optilink-dashboard-${{ github.sha }}
          path: _site

  tf-002-web-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/tf-002-single-code
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned spike dependencies
        run: npm install --no-audit --no-fund
      - name: Protocol and carrier tests
        run: npm test
      - name: Typecheck and build browser spike
        run: |
          npm run build
          test -s dist/carrier-bench.html
          test -s dist/carrier-frontier.html
          test -s dist/optigrid-v1-physical.html
      - name: Install headless Chromium for TF-005
        run: |
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1 || {
            cat /tmp/playwright-install.log
            exit 1
          }
      - name: Run TF-005 pixel-isolated carrier bench and tracking frontier
        run: npm run bench:headless
      - name: Validate lab coordinator and tunnel launcher syntax
        run: |
          node --check lab-server.mjs
          node --check lab-tunnel.mjs
          node --check lab-server-tf006.mjs
          node --check lab-tunnel-tf006.mjs
      - name: Smoke-test lab HTTP routes
        run: |
          node lab-server.mjs > /tmp/optilink-lab.log 2>&1 &
          LAB_PID=$!
          trap 'kill $LAB_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/api/lab/health > /tmp/health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status": "OK"' /tmp/health.json
          curl --fail --silent 'http://127.0.0.1:5173/?role=sender' | grep -q 'Single-code optical baseline'
          curl --fail --silent 'http://127.0.0.1:5173/?role=receiver' | grep -q 'Receiver / Camera'
          curl --fail --silent 'http://127.0.0.1:5173/fountain.html?role=sender' | grep -q 'Fountain / rateless single-QR benchmark'
          curl --fail --silent 'http://127.0.0.1:5173/fountain.html?role=receiver' | grep -q 'Peeling decoder'
          curl --fail --silent 'http://127.0.0.1:5173/optigrid.html?role=sender' | grep -q 'OptiGrid v0 · dense monochrome carrier calibration'
          curl --fail --silent 'http://127.0.0.1:5173/optigrid.html?role=receiver' | grep -q 'direct cell sampler'
      - name: Smoke-test lab token protection
        run: |
          PORT=5180 OPTILINK_LAB_TOKEN=ci-secret node lab-server.mjs > /tmp/optilink-lab-token.log 2>&1 &
          LAB_PID=$!
          trap 'kill $LAB_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5180/api/lab/health > /tmp/token-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"protected": true' /tmp/token-health.json
          test "$(curl --silent --output /tmp/no-token.txt --write-out '%{http_code}' 'http://127.0.0.1:5180/?role=sender')" = "401"
          curl --fail --silent --cookie-jar /tmp/lab-cookie.txt 'http://127.0.0.1:5180/?role=sender&token=ci-secret' | grep -q 'Single-code optical baseline'
          curl --fail --silent --cookie /tmp/lab-cookie.txt 'http://127.0.0.1:5180/fountain.html?role=sender' | grep -q 'Fountain / rateless single-QR benchmark'
          curl --fail --silent --cookie /tmp/lab-cookie.txt 'http://127.0.0.1:5180/optigrid.html?role=sender' | grep -q 'OptiGrid v0 · dense monochrome carrier calibration'
          curl --fail --silent --cookie /tmp/lab-cookie.txt 'http://127.0.0.1:5180/api/lab/latest' | grep -q 'NO_RUN'
      - name: Smoke-test TF-006 one-click physical lab
        run: |
          PORT=5184 OPTILINK_LAB_TOKEN=tf006-ci OPTILINK_LAB_INSTANCE_ID=ci-instance OPTILINK_PUBLISH_GITHUB=0 node lab-server-tf006.mjs > /tmp/tf006-lab.log 2>&1 &
          LAB_PID=$!
          trap 'kill $LAB_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5184/api/lab/health > /tmp/tf006-health.json; then
              break
            fi
            sleep 0.5
          done
          grep -q '"status": "OK"' /tmp/tf006-health.json
          grep -q '"mode": "optigrid-v1-physical"' /tmp/tf006-health.json
          grep -q '"instanceId": "ci-instance"' /tmp/tf006-health.json
          test "$(curl --silent --output /tmp/tf006-no-token.txt --write-out '%{http_code}' 'http://127.0.0.1:5184/optigrid-v1-physical.html?role=sender')" = "401"
          curl --fail --silent --cookie-jar /tmp/tf006-cookie.txt 'http://127.0.0.1:5184/optigrid-v1-physical.html?role=sender&token=tf006-ci' | grep -q 'OptiGrid v1 · physical high-density gate'
          curl --fail --silent --cookie /tmp/tf006-cookie.txt 'http://127.0.0.1:5184/optigrid-v1-physical.html?role=receiver' | grep -q 'ONE-CLICK PHYSICAL GATE'
          curl --fail --silent --cookie /tmp/tf006-cookie.txt 'http://127.0.0.1:5184/api/lab/latest' | grep -q 'NO_RUN'
      - name: Upload TF-005 carrier and frontier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optilink-carrier-bench-${{ github.sha }}
          path: experiments/tf-002-single-code/results/carrier-*.json
          if-no-files-found: warn
      - name: Upload browser spike build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optilink-browser-spikes-${{ github.sha }}
          path: experiments/tf-002-single-code/dist
          if-no-files-found: warn
